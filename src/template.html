<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg" href="./images/check-all.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Edu+NSW+ACT+Cursive:wght@400..700&family=Lexend+Zetta:wght@100..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Oswald:wght@200..700&family=Sansita+Swashed:wght@300..900&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&family=VT323&family=WDXL+Lubrifont+TC&display=swap"
        rel="stylesheet">
    <title>To Do List</title>
</head>

<body>
    <dialog id="new-project-dialog">
        <form id="new-project-dialog-form" method="dialog">
            <div>
                <label for="project-title-input">Project Title</label>
                <input type="text" name="project-title" id="project-title-input">
            </div>
            <button type="submit">
                Submit
            </button>
        </form>
    </dialog>

    <dialog id="new-task-dialog">
        <form id="new-task-dialog-form" method="dialog">
            <div>
                <label for="task-title-input">Task Title</label>
                <input type="text" name="task-title" id="task-title-input">
            </div>
            <div>
                <label for="task-description-input">Task description</label>
                <input type="text" name="task-description" id="task-description-input">
            </div>

            <div>
                <label for="task-due-date-input">Task Due Date</label>
                <input type="text" name="task-due-date" id="task-due-date-input">
            </div>

            <div>
                <label for="task-priority">Task Priority</label>
                <select id="task-priority-input" name="task-priority">
                    <option disabled selected value>-- select an option --</option>
                    <option value="High">High</option>
                    <option value="Medium">Medium</option>
                    <option value="Low">Low</option>
                </select>
            </div>

            <div>
                <label for="task-notes-input">Task Notes (Optional)</label>
                <textarea name="task-notes" id="task-notes-input" cols="20" rows="10"></textarea>
            </div>


            <button type="submit">
                Submit
            </button>
        </form>
    </dialog>

    <header>
        <img src="./images/icons8-double-check-96.png">
        <div class="title">ToDo List</div>
    </header>
    <div class="content">
        <div class="menu">
            <div class="inbox-btn-container">
                <button id="inbox-btn">
                    <img src="./images/inbox.svg">
                    <div class="subtitle">
                        Inbox
                    </div>
                </button>
            </div>
            <!-- <div class="today-btn-container">
                <button id="today-btn">
                    <img src="./images/calendar-today.svg">
                    <div class="subtitle">
                        Today
                    </div>
                </button>
            </div>
            <div class="this-week-btn-container">
                <button id="this-week-btn">
                    <img src="./images/calendar-week.svg">
                    <div class="subtitle">
                        This Week
                    </div>
                </button>
            </div>
            <div class="projects-container">
                <div id="projects-title">
                    Projects
                </div>
                <div id="project-btn-container">
                    <button id="add-project-btn">
                        <img src="./images/plus.svg">
                        <div class="subtitle">
                            Add Project
                        </div>
                    </button>
                </div>
            </div> -->
        </div>
        <div class="main-content-container">
            <div class="main-content-title">
                Inbox
            </div>
            <div class="main-content inbox">
                <button id="add-task">
                    <img src="./images/plus.svg">
                    <div class="subtitle">
                        Add Task
                    </div>
                </button>
            </div>
        </div>
    </div>
</body>

</html>
